<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1712"/>
      <stop offset="100%" stop-color="#050a08"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Card -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#bgGrad)" stroke="#1a2d24" stroke-width="2"/>
  
  <!-- Isometric 3D CAD Cube / Part Geometry -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <path d="M60 28 L86 43 L60 58 L34 43 Z" fill="#6ee7b7" opacity="0.95"/>
    <!-- Left Face -->
    <path d="M34 43 L60 58 L60 88 L34 73 Z" fill="#10b981" opacity="0.9"/>
    <!-- Right Face -->
    <path d="M60 58 L86 43 L86 73 L60 88 Z" fill="#047857" opacity="0.95"/>
    <!-- Center Bolt Hole / Bore -->
    <ellipse cx="60" cy="43" rx="10" ry="5.5" fill="#0b1712" stroke="#a7f3d0" stroke-width="1.5"/>
  </g>
  
  <!-- Dimension / CAD Vector Lines -->
  <path d="M26 38 L26 78" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.6"/>
  <path d="M22 38 L30 38" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M22 78 L30 78" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
</svg>